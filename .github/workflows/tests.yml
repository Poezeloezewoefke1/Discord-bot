# Runs the test suite on every push and pull request.
#
# This is what GitHub Actions is actually designed for, and it's what tells you
# whether a change broke the claim/handoff logic before it reaches your server.

name: Tests

on:
  push:
    branches-ignore:
      - bot-data        # the state branch holds data, not code — nothing to test
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Check everything compiles
        run: python -m compileall -q bot.py config.py db.py embeds.py service.py views.py cogs hosting
